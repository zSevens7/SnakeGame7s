<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE 7S</title>
    <link rel="stylesheet" href="styleSN.css">
</head>
<body>
    <div class="game-container">
        <h1>SNAKE 7S</h1>
        <div class="game-board" id="gameBoard"></div>
        <button id="startGame">Start</button>
<button id="pauseGame">Pausar</button>
        <div class="rules">
            <p>Para andar: WASD ou setas do teclado.</p>
            <p>A comida da maçã adiciona +1 ao corpo.</p>
            <p>A comida do rato adiciona +2 ao corpo e se move verticalmente.</p>
            <p>Desenvolvido por Sevens</p>
        </div>
        <!-- Usando "/" no início para referenciar a raiz do domínio -->
                <button onclick="window.location.href='/index.html'">Voltar</button>
    </div>
    <script src="scriptSN.js"></script>
</body>
</html>
